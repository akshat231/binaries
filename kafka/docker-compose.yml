version: "3.8"

services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    restart: always

    env_file:
      - .env

    environment:
      KAFKA_NODE_ID: ${KAFKA_BROKER_ID}
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_BROKER_ID}@kafka:${KAFKA_CONTROLLER_PORT}

      KAFKA_LISTENERS: >
        PLAINTEXT_INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT},
        PLAINTEXT_EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT},
        CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT_INTERNAL://${KAFKA_INTERNAL_HOST}:${KAFKA_INTERNAL_PORT},
        PLAINTEXT_EXTERNAL://${KAFKA_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT_INTERNAL:PLAINTEXT,
        PLAINTEXT_EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_LOG_DIRS: ${KAFKA_LOG_DIRS}
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"
      - "${KAFKA_INTERNAL_PORT}:${KAFKA_INTERNAL_PORT}"
      - "${KAFKA_CONTROLLER_PORT}:${KAFKA_CONTROLLER_PORT}"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - shared_network

volumes:
  kafka-data:

networks:
  shared_network:
    external: true
