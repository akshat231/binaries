version: '3.9'

services:
  redis:
    image: "redis:${REDIS_VERSION}"
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - "${REDIS_VOLUME_NAME}:/data"
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]

volumes:
  redis_data: 

networks:
  shared_network:
    external: true
